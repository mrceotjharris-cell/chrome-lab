<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>goldentune.ai</title>
<meta name="description" content="Iyelle is the Goldentune model that keeps your traffic engines running, and names the one that isn't." />
<meta name="theme-color" content="#000000" />
<meta property="og:title" content="goldentune.ai" />
<meta property="og:description" content="Iyelle is the Goldentune model that keeps your traffic engines running, and names the one that isn't." />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><defs><radialGradient id='g' cx='38%25' cy='33%25'><stop offset='0' stop-color='%23ffdd77'/><stop offset='.5' stop-color='%23f5c542'/><stop offset='1' stop-color='%23c8901e'/></radialGradient></defs><circle cx='16' cy='16' r='10' fill='url(%23g)'/></svg>" />
<style>
  /* Same token set as dashboard.html. Gold is identity; the one status
     signal on this page (the renderer dot) uses the live green. */
  :root{
    --gold:#f5c542; --gold-hi:#ffdd77; --gold-dp:#c8901e;
    --ink:#000; --txt:#f4efe4; --txt-2:#cbc2b1; --dim:#6e6555;
    --ok:#5fd9a0; --warn:#ff9147; --bad:#ff6b6b;
    --ui:"Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,Inter,
         "Helvetica Neue",Arial,sans-serif;
    --mono:"SF Mono",SFMono-Regular,"Cascadia Mono","Roboto Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:var(--ink)}
  body{font-family:var(--ui);color:var(--txt);-webkit-font-smoothing:antialiased;
       opacity:0;transition:opacity .7s ease}
  body.ready{opacity:1}

  #stage{position:fixed;inset:0;z-index:1}
  #stage canvas{display:block}

  #wash,#grid{position:fixed;inset:0;pointer-events:none;z-index:0}
  #wash{background:
    radial-gradient(64% 52% at 20% 12%, rgba(245,197,66,.17), transparent 68%),
    radial-gradient(55% 45% at 84% 80%, rgba(200,138,30,.14), transparent 70%),
    radial-gradient(52% 42% at 58% 104%, rgba(255,221,119,.08), transparent 72%);}
  /* the hairline wireframe sphere off the carousel artwork */
  #grid{opacity:.5;
    background:repeating-radial-gradient(circle at 50% 50%,
      transparent 0 19px, rgba(245,197,66,.13) 19px 20px);
    mask-image:radial-gradient(circle at 50% 50%,#000 0 34%,transparent 62%);
    -webkit-mask-image:radial-gradient(circle at 50% 50%,#000 0 34%,transparent 62%);}

  /* ---------- copy ---------- */
  #hero{position:fixed;z-index:5;left:0;right:0;top:50%;transform:translateY(-50%);
        text-align:center;pointer-events:none;padding:0 24px}
  /* Soft scrim. Three stacked lines sit over the brightest part of the mesh,
     and per-line text-shadow alone could not hold the small caps. Negative
     z-index keeps it inside #hero's stacking context — above the canvas,
     below the copy — and the radial falloff means no visible edge. */
  #hero::before{content:"";position:absolute;inset:-14% -8%;z-index:-1;pointer-events:none;
    background:radial-gradient(ellipse at 50% 50%, rgba(0,0,0,.74) 0%,
               rgba(0,0,0,.52) 44%, transparent 72%)}
  /* No mix-blend-mode here any more — differenced against a gold blob it
     inverted the wordmark to blue every time the mesh drifted behind it. */
  h1{font-size:clamp(38px,9vw,104px);font-weight:700;letter-spacing:-.015em;line-height:1;
     color:#fff;text-shadow:0 2px 30px rgba(0,0,0,.85),0 0 70px rgba(245,197,66,.4)}
  h1 i{font-style:normal;color:var(--gold);text-shadow:0 2px 30px rgba(0,0,0,.85),
       0 0 46px rgba(245,197,66,.75)}
  /* Neutral, not gold: the mesh drifts behind these lines, and gold-on-gold
     disappeared completely. The dark halo keeps them legible over both the
     black ground and the bright mesh. */
  .lede{margin:18px auto 0;max-width:30ch;font-size:clamp(15px,2.4vw,24px);font-weight:600;
        line-height:1.4;letter-spacing:-.01em;color:var(--txt);
        text-shadow:0 1px 12px rgba(0,0,0,.95),0 0 30px rgba(0,0,0,.85)}
  /* Iyelle is a name, so it takes the brand gold — same rule as the .ai above.
     The mesh behind this copy is Iyelle; the gold ties the word to the shape. */
  .lede i{font-style:normal;color:var(--gold);
          text-shadow:0 1px 12px rgba(0,0,0,.95),0 0 34px rgba(245,197,66,.6)}
  .tag{margin-top:16px;font-size:clamp(8px,1.5vw,10.5px);font-weight:600;letter-spacing:.34em;
       text-transform:uppercase;color:var(--txt);
       text-shadow:0 1px 10px rgba(0,0,0,.95),0 0 26px rgba(0,0,0,.8)}

  /* ---------- panel ---------- */
  .panel{position:fixed;z-index:10;background:rgba(20,16,10,.55);
    backdrop-filter:blur(22px) saturate(130%);-webkit-backdrop-filter:blur(22px) saturate(130%);
    border:1px solid rgba(245,197,66,.16);border-radius:14px;
    box-shadow:0 0 0 1px rgba(245,197,66,.04) inset,0 16px 50px rgba(0,0,0,.72)}
  #meta{bottom:18px;right:18px;padding:12px 14px;width:196px}
  .stat{display:flex;align-items:center;gap:8px;font-size:9.5px;font-weight:600;
        letter-spacing:.14em;margin-bottom:7px;color:var(--txt-2)}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok);
       animation:p 1.6s ease-in-out infinite;flex:none}
  @keyframes p{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.72)}}
  .kv{display:flex;justify-content:space-between;font-family:var(--mono);
      font-variant-numeric:tabular-nums;font-size:9px;letter-spacing:.07em;
      padding:4.5px 0;border-top:1px solid rgba(255,255,255,.06);color:var(--dim)}
  .kv span:last-child{color:var(--txt-2)}
  .kv b{color:var(--gold);font-weight:600}

  #mark{position:fixed;bottom:20px;left:20px;z-index:10;font-size:9px;letter-spacing:.24em;
        text-transform:uppercase;color:#6e655590}
  #ops{position:fixed;top:20px;right:20px;z-index:20;font-size:9.5px;font-weight:600;
       letter-spacing:.26em;text-transform:uppercase;text-decoration:none;color:var(--gold);
       padding:10px 16px;border:1px solid rgba(245,197,66,.32);border-radius:10px;
       background:rgba(20,16,10,.55);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
       transition:.18s;display:flex;align-items:center;gap:9px}
  #ops:hover{background:var(--gold);border-color:var(--gold);color:#1a1409;
             box-shadow:0 0 28px rgba(245,197,66,.38)}
  #ops .d{width:6px;height:6px;border-radius:50%;background:var(--ok);
          box-shadow:0 0 8px var(--ok);animation:pulse 1.7s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}
  @media(prefers-reduced-motion:reduce){#ops .d{animation:none}}
  @media(max-width:700px){#ops{top:14px;right:14px;padding:9px 13px;font-size:8.5px}}
  @media(max-width:700px){ #meta{display:none} #mark{left:50%;transform:translateX(-50%)} }
  @media(prefers-reduced-motion:reduce){ .dot{animation:none} }
</style>
</head>
<body>
<div id="wash"></div><div id="grid"></div><div id="stage"></div>

<div id="hero">
  <h1>goldentune<i>.ai</i></h1>
  <p class="lede">Meet <i>Iyelle</i> — the model that keeps your traffic engines
     running, and names the one that isn't.</p>
  <div class="tag">server-side tracking · continuous tuning · one next action</div>
</div>

<div class="panel" id="meta">
  <div class="stat"><span class="dot"></span><span id="st">IYELLE · BOOTING</span></div>
  <div class="kv"><span>fps</span><span id="fps">—</span></div>
  <div class="kv"><span>triangles</span><span id="tri">—</span></div>
  <div class="kv"><span>page weight</span><span id="wt">—</span></div>
  <div class="kv"><span>api cost</span><span><b>$0.00</b></span></div>
</div>

<a id="ops" href="/dashboard.html"><span class="d"></span>n8n ops</a>
<div id="mark">built with three.js</div>
